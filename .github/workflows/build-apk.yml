name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect Java version string."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Active Java major version: $MAJOR_VER"
          
          if [ -z "$MAJOR_VER" ] || ! [ "$MAJOR_VER" -eq "$MAJOR_VER" ] 2>/dev/null; then
            echo "ERROR: Could not parse Java major version number from '$JAVA_VER'."
            exit 1
          fi
          
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi
          echo "Java version check passed ($MAJOR_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          echo "=== Configuring Stable Debug Keystore ==="
          DEBUG_KEYSTORE_PATH="${GITHUB_WORKSPACE:-.}/debug.keystore"

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug keystore from DEBUG_KEYSTORE_BASE64 secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$DEBUG_KEYSTORE_PATH"
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Restoring stable repository debug keystore from ./debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > "$DEBUG_KEYSTORE_PATH"
          elif [ -f "./debug.keystore" ]; then
            echo "Using existing repository ./debug.keystore..."
            cp ./debug.keystore "$DEBUG_KEYSTORE_PATH" 2>/dev/null || true
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring debug keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$DEBUG_KEYSTORE_PATH"
          else
            echo "ERROR: Stable debug keystore not found in repository or secrets!"
            echo "Expected ./debug.keystore.base64 or ./debug.keystore to exist."
            exit 1
          fi

          if [ ! -s "$DEBUG_KEYSTORE_PATH" ]; then
            echo "ERROR: Keystore file $DEBUG_KEYSTORE_PATH does not exist or is empty."
            exit 1
          fi

          echo "DEBUG_KEYSTORE_FILE=$DEBUG_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PASSWORD=${DEBUG_KEYSTORE_PASSWORD:-android}" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_PASSWORD=${DEBUG_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"

          echo "=== Stable Debug Keystore Verification ==="
          keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -storepass "${DEBUG_KEYSTORE_PASSWORD:-android}" | grep -E "(Alias name|SHA1|SHA256):" || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying built APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK."
            echo "Searching app/build/outputs/apk for generated APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          
          echo "APK verification successful: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

          echo "=== ACTUAL DEBUG APK CERTIFICATE ==="
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR"/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$SDK_DIR"/build-tools -name aapt2 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            PKG_NAME=$("$AAPT2" dump packagename "$EXPECTED_APK" 2>/dev/null || echo "com.aistudio.notes.dktzpq")
          else
            PKG_NAME="com.aistudio.notes.dktzpq"
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$EXPECTED_APK" 2>/dev/null || true)
            RAW_SHA1=$(echo "$CERT_OUTPUT" | grep -i "SHA-1 digest:" | head -n 1 | awk '{print $NF}')
            RAW_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
            FORMATTED_SHA1=$(echo "$RAW_SHA1" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')
            FORMATTED_SHA256=$(echo "$RAW_SHA256" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')
          else
            CERT_OUTPUT=$(keytool -printcert -jarfile "$EXPECTED_APK" 2>/dev/null || true)
            FORMATTED_SHA1=$(echo "$CERT_OUTPUT" | grep -i "SHA1:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')
            FORMATTED_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')
          fi

          echo "Package: $PKG_NAME"
          echo "SHA-1: $FORMATTED_SHA1"
          echo "SHA-256: $FORMATTED_SHA256"
          echo "======================================"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing release asset ==="
          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F/ '{print $2}')
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          
          if [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $DEST_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is missing or empty at '$ASSET_PATH'."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"; exit 1 ;;
          esac
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
          ### Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit SHA:** `${{ github.sha }}`
          - **Purpose:** Testing and validation
          - **Note:** This APK is signed only with a temporary debug keystore and is not intended for Play Store production release.

          Download the APK directly from the **Assets** section below.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Summary & Download Report ==="
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo ""
              echo "### 📥 Download APK via GitHub Releases"
              echo "- **Release Page:** [$TITLE ($TAG)]($RELEASE_URL)"
              echo "- **Asset File:** \`$ASSET_NAME\`"
              echo "- The APK can be downloaded directly to your phone from the **Assets** section of the release page."
              echo ""
              echo "### 📦 Backup Actions Artifact"
              echo "- The artifact named **\`app-debug-apk\`** is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            echo "APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."
            
            {
              echo "## 🚀 Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK built successfully!**"
              echo ""
              echo "⚠️ **GitHub Release publishing was skipped or encountered an error.**"
              echo "- **Backup Download Available:** The debug APK is safely preserved as a workflow artifact named **\`app-debug-apk\`** in this run's summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
