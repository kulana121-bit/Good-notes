name: Build and Release Optimized APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java full version string: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Unable to detect Java version string."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Active Java major version: $MAJOR_VER"
          
          if [ -z "$MAJOR_VER" ] || ! [ "$MAJOR_VER" -eq "$MAJOR_VER" ] 2>/dev/null; then
            echo "ERROR: Could not parse Java major version number from '$JAVA_VER'."
            exit 1
          fi
          
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi
          echo "Java version check passed ($MAJOR_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Configuring Release Signing Keystore ==="
          RELEASE_KEYSTORE_PATH="${GITHUB_WORKSPACE:-.}/release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom keystore from GitHub Secrets (KEYSTORE_BASE64)..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_PATH"

            KEY_STORE_PASS="${KEYSTORE_PASSWORD:-releasepass123}"
            ALIAS_NAME="${KEY_ALIAS:-release}"
            KEY_PASS="${KEY_PASSWORD:-$KEY_STORE_PASS}"

            if [ ! -s "$RELEASE_KEYSTORE_PATH" ]; then
              echo "::warning::Failed to decode KEYSTORE_BASE64. Falling back to persistent repository keystore..."
              rm -f "$RELEASE_KEYSTORE_PATH"
            elif ! keytool -list -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$KEY_STORE_PASS" -alias "$ALIAS_NAME" > /dev/null 2>&1; then
              echo "::warning::Custom keystore validation failed with provided credentials. Falling back to persistent repository keystore..."
              rm -f "$RELEASE_KEYSTORE_PATH"
            else
              echo "Custom release keystore validated successfully."
              echo "KEYSTORE_FILE=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
              echo "KEYSTORE_PASSWORD=$KEY_STORE_PASS" >> "$GITHUB_ENV"
              echo "KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            fi
          fi

          if [ ! -f "$RELEASE_KEYSTORE_PATH" ]; then
            if [ -f "./debug.keystore.base64" ]; then
              echo "Restoring registered persistent keystore from ./debug.keystore.base64..."
              base64 -d ./debug.keystore.base64 > "$RELEASE_KEYSTORE_PATH"
            elif [ -f "./debug.keystore" ]; then
              echo "Copying registered persistent keystore from ./debug.keystore..."
              cp ./debug.keystore "$RELEASE_KEYSTORE_PATH"
            fi

            if [ -s "$RELEASE_KEYSTORE_PATH" ]; then
              echo "KEYSTORE_FILE=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
              echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
              echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
              echo "Registered persistent keystore configured for release build."
            else
              echo "Generating fallback release keystore..."
              keytool -genkeypair -v \
                -keystore "$RELEASE_KEYSTORE_PATH" \
                -storepass releasepass123 \
                -alias release \
                -keypass releasepass123 \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Good Notes Release,O=Good Notes,C=US"

              echo "KEYSTORE_FILE=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
              echo "KEYSTORE_PASSWORD=releasepass123" >> "$GITHUB_ENV"
              echo "KEY_ALIAS=release" >> "$GITHUB_ENV"
              echo "KEY_PASSWORD=releasepass123" >> "$GITHUB_ENV"
            fi
          fi

          echo "=== Release Keystore Fingerprints ==="
          STORE_PASS="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-androiddebugkey}"
          keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -storepass "$STORE_PASS" 2>/dev/null | grep -E "(Owner:|Issuer:|Alias name:|Valid from:|Certificate fingerprints:|SHA1:|SHA256:)" || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK and print signature fingerprints
        run: |
          echo "=== Verifying built release APK ==="
          EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected release APK not found at $EXPECTED_APK."
            echo "Searching app/build/outputs/apk/release for generated APK files..."
            if [ -d "app/build/outputs/apk/release" ]; then
              find app/build/outputs/apk/release -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk/release does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Release APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "Release APK verification successful: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"
          
          echo "=== ACTUAL APK SIGNING CERTIFICATE ==="
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR"/build-tools -name apksigner 2>/dev/null | sort -V | tail -n 1)
          AAPT2=$(find "$SDK_DIR"/build-tools -name aapt2 2>/dev/null | sort -V | tail -n 1)

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            PKG_NAME=$("$AAPT2" dump packagename "$EXPECTED_APK" 2>/dev/null || echo "com.aistudio.notes.dktzpq")
          else
            PKG_NAME="com.aistudio.notes.dktzpq"
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$EXPECTED_APK" 2>/dev/null || true)
            RAW_SHA1=$(echo "$CERT_OUTPUT" | grep -i "SHA-1 digest:" | head -n 1 | awk '{print $NF}')
            RAW_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
            FORMATTED_SHA1=$(echo "$RAW_SHA1" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')
            FORMATTED_SHA256=$(echo "$RAW_SHA256" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')
          else
            CERT_OUTPUT=$(keytool -printcert -jarfile "$EXPECTED_APK" 2>/dev/null || true)
            FORMATTED_SHA1=$(echo "$CERT_OUTPUT" | grep -i "SHA1:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')
            FORMATTED_SHA256=$(echo "$CERT_OUTPUT" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr '[:lower:]' '[:upper:]')
          fi

          EXPECTED_SHA1="C7:42:4F:50:C7:3A:99:41:0D:82:15:4F:7B:F9:31:05:AA:E6:37:94"
          echo "Package: $PKG_NAME"
          echo "SHA-1: $FORMATTED_SHA1"
          echo "SHA-256: $FORMATTED_SHA256"
          echo "Expected SHA-1: $EXPECTED_SHA1"
          if [ "$FORMATTED_SHA1" = "$EXPECTED_SHA1" ]; then
            echo "Firebase/OAuth Match: MATCHED"
          else
            echo "Firebase/OAuth Match: MISMATCH"
          fi
          echo "======================================"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing release asset ==="
          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)

          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F/ '{print $2}')
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-release-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_ASSET_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/release/app-release.apk" "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare non-empty release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is missing or empty at '$ASSET_PATH'."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"; exit 1 ;;
          esac

          TAG="release-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK #${{ github.run_number }}"

          NOTES=$(cat << 'EOF'
          ### Optimized Production Release APK

          This is an optimized release APK built with R8 code shrinking, resource shrinking, and Moshi codegen adapters.

          - **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit SHA:** `${{ github.sha }}`
          - **R8 Minification:** Enabled
          - **Resource Shrinking:** Enabled

          Download the release APK directly from the **Assets** section below.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Summary & Download Report ==="
          TAG="release-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG" || true

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"

            {
              echo "## 🚀 Release APK Build Summary"
              echo ""
              echo "✅ **Optimized release APK built successfully!**"
              echo ""
              echo "### 📥 Download APK via GitHub Releases"
              echo "- **Release Page:** [$TITLE ($TAG)]($RELEASE_URL)"
              echo "- **Asset File:** \`$ASSET_NAME\`"
              echo "- Direct download available in the release **Assets** section."
              echo ""
              echo "### 📦 Actions Artifact"
              echo "- The artifact named **\`release-apk\`** is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            echo "Release APK build succeeded and the GitHub Actions artifact 'release-apk' remains available for download."

            {
              echo "## 🚀 Release APK Build Summary"
              echo ""
              echo "✅ **Release APK built successfully!**"
              echo ""
              echo "⚠️ **GitHub Release publishing was skipped or encountered a warning.**"
              echo "- **Download Available:** The release APK is preserved as workflow artifact **\`release-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
